<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — 류화정 · G.Ryu</title>
  <meta name="description" content="류화정(G.Ryu) 작가 새소식. 전시 일정, ART:M 플랫폼 업데이트, 작품 소식.">
  <meta property="og:title" content="News — 류화정 · G.Ryu">
  <meta property="og:url" content="https://g-ryu.com/news.html">
  <link rel="stylesheet" href="styles.css">
  <style>
    .news-header {
      padding: 3.5rem 2.5rem 2rem;
      border-bottom: 0.5px solid var(--subtle);
    }
    .news-header h1 {
      font-family: var(--font-serif-en);
      font-size: 2.5rem;
      font-weight: 300;
      margin-top: 0.8rem;
    }

    .news-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      min-height: calc(100vh - 200px);
    }
    .news-main {
      border-right: 0.5px solid var(--subtle);
    }
    .news-entry {
      padding: 2rem 2.5rem;
      border-bottom: 0.5px solid var(--subtle);
      cursor: pointer;
      transition: background 0.2s;
    }
    .news-entry:hover { background: var(--paper-dark); }
    .news-entry-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .news-entry-date {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .news-entry-tag {
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--gold-pale);
      color: var(--gold);
      padding: 0.2rem 0.5rem;
    }
    .news-entry-title {
      font-family: var(--font-serif-en);
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .news-entry-body {
      font-size: 0.72rem;
      line-height: 1.85;
      color: var(--muted);
    }

    .news-sidebar {
      padding: 2rem;
    }
    .sidebar-block { margin-bottom: 2.5rem; }
    .sidebar-title {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 0.5px solid var(--subtle);
    }
    .sidebar-tag {
      display: inline-block;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 0.5px solid var(--subtle);
      padding: 0.25rem 0.6rem;
      margin: 0.2rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }
    .sidebar-tag:hover,
    .sidebar-tag.active { border-color: var(--ink); color: var(--ink); }

    .subscribe-box {
      border: 0.5px solid var(--subtle);
      padding: 1.2rem;
    }
    .subscribe-box p {
      font-size: 0.68rem;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .subscribe-input {
      width: 100%;
      border: 0.5px solid var(--subtle);
      background: transparent;
      padding: 0.5rem 0.7rem;
      font-size: 0.65rem;
      font-family: var(--font-sans);
      color: var(--ink);
      margin-bottom: 0.5rem;
      outline: none;
    }
    .subscribe-input:focus { border-color: var(--ink); }
    .subscribe-input::placeholder { color: var(--muted); }

    @media (max-width: 768px) {
      .news-layout { grid-template-columns: 1fr; }
      .news-sidebar { display: none; }
      .news-entry { padding: 1.5rem 1.2rem; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo__en">G · Ryu</span>
      <span class="nav-logo__kr">류화정</span>
    </a>
    <ul class="nav-links">
      <li><a href="works.html">Works</a></li>
      <li><a href="https://www.saatchiart.com/en-kr/account/artworks/1065821" target="_blank" rel="noopener" class="nav-ext">Saatchi Art</a></li>
      <li><a href="#" class="nav-coming" style="opacity:0.4;cursor:default">Digital Goods</a></li>
      <li><a href="artm.html" class="nav-artm">ART:M</a></li>
      <li><a href="news.html" class="active">News</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <button class="nav-lang"><span>KR</span> / EN</button>
  </nav>

  <div class="page">

    <div class="news-header">
      <p class="u-label">News · 새소식</p>
      <h1>News</h1>
    </div>

    <div class="news-layout">
      <main class="news-main" id="newsMain">
        <p style="padding:2rem;color:var(--muted);font-size:0.75rem">불러오는 중...</p>
      </main>

      <aside class="news-sidebar">
        <div class="sidebar-block">
          <p class="sidebar-title">Category</p>
          <span class="sidebar-tag active">전체</span>
          <span class="sidebar-tag">공지</span>
          <span class="sidebar-tag">작품</span>
          <span class="sidebar-tag">전시</span>
          <span class="sidebar-tag">ART:M</span>
          <span class="sidebar-tag">소식</span>
        </div>

        <div class="sidebar-block">
          <p class="sidebar-title">소식 받기</p>
          <div class="subscribe-box">
            <p>ART:M 오픈 소식과 새 전시 일정을 이메일로 받아보세요.</p>
            <input type="text" id="sideFirstname" class="subscribe-input" placeholder="이름">
            <input type="email" id="sideEmail" class="subscribe-input" placeholder="이메일 주소" style="margin-top:0.4rem">
            <button class="btn btn-dark" id="sideSubmitBtn" style="width:100%;padding:0.6rem;margin-top:0.5rem" onclick="sideSubscribe()">구독하기</button>
            <p id="sideSuccess" style="display:none;font-size:0.65rem;color:var(--gold);margin-top:0.5rem;line-height:1.6">신청 완료! ART:M 소식을 전해드리겠습니다.</p>
          </div>
        </div>
      </aside>
    </div>

  </div>

  <script>
    /* ── 카테고리 필터 ── */
    var currentFilter = '전체';
    document.querySelectorAll('.sidebar-tag').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sidebar-tag').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.textContent.trim();
        renderNews(window._newsData || []);
      });
    });

    function renderNews(news) {
      var filtered = currentFilter === '전체'
        ? news
        : news.filter(function(n){ return n.type === currentFilter; });
      document.getElementById('newsMain').innerHTML = filtered.length
        ? filtered.map(function(n) {
            return '<article class="news-entry">'
              + '<div class="news-entry-head">'
              + '<span class="news-entry-date">' + n.date + '</span>'
              + '<span class="news-entry-tag">' + n.type + '</span>'
              + '</div>'
              + '<h2 class="news-entry-title">' + n.title + '</h2>'
              + '<p class="news-entry-body">' + n.body + '</p>'
              + '</article>';
          }).join('')
        : '<p style="padding:2rem;color:var(--muted);font-size:0.75rem">해당 카테고리의 소식이 없습니다.</p>';
    }

    fetch('news.json')
      .then(function(r){ return r.json(); })
      .then(function(news) {
        window._newsData = news;
        renderNews(news);
      })
      .catch(function(){
        document.getElementById('newsMain').innerHTML =
          '<p style="padding:2rem;color:var(--muted);font-size:0.75rem">소식을 불러올 수 없습니다.</p>';
      });

    /* ── 사이드바 구독 (Brevo) ── */
    function sideSubscribe() {
      var firstname = document.getElementById('sideFirstname').value.trim();
      var email     = document.getElementById('sideEmail').value.trim();
      if (!email) { alert('이메일을 입력해주세요.'); return; }

      var btn = document.getElementById('sideSubmitBtn');
      btn.textContent = '처리 중...';
      btn.disabled = true;

      var formData = new FormData();
      formData.append('FIRSTNAME', firstname);
      formData.append('EMAIL', email);
      formData.append('email_address_check', '');
      formData.append('locale', 'ko');

      fetch('https://553a93a7.sibforms.com/serve/MUIFAORLOdgYOZfJnC3EdQ81DawEPkdp3PvrlV1CCwOTi5P4619ZatxN2MiFgZKQqJdH1e4bZc3eyBeKJiZACNstTVJrabqU_uDnTZXujtXC2seXyO8VghPAm6O8KKefZro3RZyQUWWiQqa49U-jV-H_qK0AJtcV_E8gxBn-92kmr25oxwXUBVQg30OSn7brrd2ZA__i_-2CGgh0vA==', {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      })
      .then(function() {
        btn.style.display = 'none';
        document.getElementById('sideFirstname').style.display = 'none';
        document.getElementById('sideEmail').style.display = 'none';
        document.getElementById('sideSuccess').style.display = 'block';
      })
      .catch(function() {
        btn.textContent = '구독하기';
        btn.disabled = false;
        alert('오류가 발생했습니다. 다시 시도해주세요.');
      });
    }
  </script>

  <footer class="footer">
    <div class="footer-logo">G · Ryu / 류화정</div>
    <div class="footer-socials">
      <a href="https://instagram.com/studio.gryu" target="_blank" rel="noopener">Instagram</a>
      <a href="https://threads.net/gilbert1737" target="_blank" rel="noopener">Threads</a>
      <a href="https://facebook.com/G.Ryu1737" target="_blank" rel="noopener">Facebook</a>
    </div>
    <span class="footer-copy">© 2025 Hwajung Ryu. All Rights Reserved.</span>
  </footer>

</body>
</html>
